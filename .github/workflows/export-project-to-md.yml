name: Export Project To Markdown And HTML

on:
  push:
    paths-ignore:
      - project-files.md
      - project-files.html
      - artifact.tar
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    env:
      OUTPUT_MD: "project-files.md"
      OUTPUT_HTML: "project-files.html"
      # Space-separated folders to include. Leave empty to include the whole repo.
      INCLUDE_DIRS: ""
      # Space-separated folders to exclude from export.
      EXCLUDE_DIRS: ".git node_modules dist build .next .cache"
      # Space-separated files to exclude from export.
      EXCLUDE_FILES: "artifact.tar"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build markdown and html exports
        shell: bash
        run: |
          set -euo pipefail

          python3 << 'PY'
          import hashlib
          import html
          import os
          from pathlib import Path

          output_md = os.getenv("OUTPUT_MD", "project-files.md")
          output_html = os.getenv("OUTPUT_HTML", "project-files.html")

          include_dirs = [x.strip() for x in os.getenv("INCLUDE_DIRS", "").split() if x.strip()]
          exclude_dirs = [x.strip().lstrip("./").rstrip("/") for x in os.getenv("EXCLUDE_DIRS", "").split() if x.strip()]
          exclude_files = {x.strip().lstrip("./") for x in os.getenv("EXCLUDE_FILES", "").split() if x.strip()}

          root = Path(".").resolve()

          def should_skip(rel_path: str) -> bool:
              if rel_path in {output_md, output_html}:
                  return True
              if rel_path.startswith(".git/"):
                  return True
              if rel_path in exclude_files:
                  return True
              for folder in exclude_dirs:
                  if rel_path == folder or rel_path.startswith(folder + "/"):
                      return True
              return False

          def candidate_files():
              found = []
              if include_dirs:
                  for folder in include_dirs:
                      p = Path(folder.lstrip("./"))
                      if p.is_dir():
                          found.extend(x for x in p.rglob("*") if x.is_file())
              else:
                  found.extend(x for x in Path(".").rglob("*") if x.is_file())

              unique = {}
              for f in found:
                  rel = f.resolve().relative_to(root).as_posix()
                  unique[rel] = f

              for rel in sorted(unique.keys()):
                  if not should_skip(rel):
                      yield unique[rel], rel

          def is_text_file(path: Path) -> bool:
              try:
                  chunk = path.read_bytes()[:8192]
              except OSError:
                  return False
              if b"\x00" in chunk:
                  return False
              try:
                  chunk.decode("utf-8")
                  return True
              except UnicodeDecodeError:
                  return False

          md_lines = [
              "# Project Files Snapshot",
              "",
              "Generated by GitHub Actions workflow: .github/workflows/export-project-to-md.yml",
              "",
          ]

          html_lines = [
              "<!DOCTYPE html>",
              "<html lang=\"en\">",
              "<head>",
              "  <meta charset=\"UTF-8\">",
              "  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">",
              "  <title>Project Files Snapshot</title>",
              "  <style>",
              "    body { font-family: Arial, sans-serif; margin: 24px; line-height: 1.5; }",
              "    h1 { margin-top: 0; }",
              "    h2 { margin-top: 28px; font-size: 18px; }",
              "    pre { background: #f6f8fa; padding: 12px; overflow-x: auto; border: 1px solid #d0d7de; }",
              "    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }",
              "  </style>",
              "</head>",
              "<body>",
              "  <h1>Project Files Snapshot</h1>",
              "  <p>Generated by GitHub Actions workflow: <code>.github/workflows/export-project-to-md.yml</code></p>",
          ]

          for file_path, rel in candidate_files():
              md_lines.append(f"## `{rel}`")
              html_lines.append(f"  <h2><code>{html.escape(rel)}</code></h2>")

              if is_text_file(file_path):
                  ext = file_path.suffix.lstrip(".") or "txt"
                  text = file_path.read_text(encoding="utf-8", errors="replace")
                  md_lines.append(f"```{ext}")
                  md_lines.append(text)
                  md_lines.append("```")
                  md_lines.append("")

                  html_lines.append("  <pre><code>")
                  html_lines.append(html.escape(text))
                  html_lines.append("  </code></pre>")
              else:
                  file_bytes = file_path.read_bytes()
                  size = len(file_bytes)
                  sha256 = hashlib.sha256(file_bytes).hexdigest()

                  md_lines.append("Binary file (content not embedded).")
                  md_lines.append("")
                  md_lines.append(f"- Size: {size} bytes")
                  md_lines.append(f"- SHA256: {sha256}")
                  md_lines.append("")

                  html_lines.append("  <p>Binary file (content not embedded).</p>")
                  html_lines.append("  <ul>")
                  html_lines.append(f"    <li>Size: {size} bytes</li>")
                  html_lines.append(f"    <li>SHA256: {sha256}</li>")
                  html_lines.append("  </ul>")

          html_lines.extend(["</body>", "</html>"])

          Path(output_md).write_text("\n".join(md_lines) + "\n", encoding="utf-8")
          Path(output_html).write_text("\n".join(html_lines) + "\n", encoding="utf-8")
          PY

      - name: Upload md and html as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-export
          path: |
            project-files.md
            project-files.html
          if-no-files-found: error
          retention-days: 14