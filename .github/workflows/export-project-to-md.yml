name: Export Project To Markdown

on:
  push:
    paths-ignore:
      - project-files.md
      - artifact.tar
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Output markdown file name.
      OUTPUT_FILE: "project-files.md"
      # Space-separated folders to include. Leave empty to include the whole repo.
      INCLUDE_DIRS: ""
      # Space-separated folders to exclude from export.
      EXCLUDE_DIRS: ".git node_modules dist build .next .cache"
      # Space-separated files to exclude from export.
      EXCLUDE_FILES: "artifact.tar"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build single markdown file
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$OUTPUT_FILE"
          TMP_LIST="$(mktemp)"

          {
            echo "# Project Files Snapshot"
            echo
            echo "Generated by GitHub Actions workflow: \\.github/workflows/export-project-to-md.yml"
            echo
          } > "$OUTPUT"

          if [[ -n "${INCLUDE_DIRS// }" ]]; then
            for dir in $INCLUDE_DIRS; do
              clean_dir="${dir#./}"
              if [[ -d "$clean_dir" ]]; then
                find "./$clean_dir" -type f -print0 >> "$TMP_LIST"
              fi
            done
          else
            find . -type f -print0 >> "$TMP_LIST"
          fi

          sort -zu "$TMP_LIST" -o "$TMP_LIST"

          while IFS= read -r -d '' file; do
            rel="${file#./}"

            skip=false
            for ex in $EXCLUDE_DIRS; do
              clean_ex="${ex#./}"
              clean_ex="${clean_ex%/}"
              if [[ "$rel" == "$clean_ex" || "$rel" == "$clean_ex/"* ]]; then
                skip=true
                break
              fi
            done

            if [[ "$rel" == "$OUTPUT" || "$rel" == ".git/"* ]]; then
              skip=true
            fi

            if [[ "$skip" == true ]]; then
              continue
            fi

            for ex_file in $EXCLUDE_FILES; do
              clean_file="${ex_file#./}"
              if [[ "$rel" == "$clean_file" ]]; then
                skip=true
                break
              fi
            done

            if [[ "$skip" == true ]]; then
              continue
            fi

            echo "## \\`$rel\\`" >> "$OUTPUT"

            if grep -Iq . "$file"; then
              ext="${rel##*.}"
              if [[ "$rel" == "$ext" ]]; then
                ext="txt"
              fi

              echo "\\`\\`\\`$ext" >> "$OUTPUT"
              cat "$file" >> "$OUTPUT"
              echo >> "$OUTPUT"
              echo "\\`\\`\\`" >> "$OUTPUT"
              echo >> "$OUTPUT"
            else
              size_bytes="$(wc -c < "$file" | tr -d ' ')"
              sha256="$(sha256sum "$file" | awk '{print $1}')"

              echo "Binary file (content not embedded)." >> "$OUTPUT"
              echo >> "$OUTPUT"
              echo "- Size: ${size_bytes} bytes" >> "$OUTPUT"
              echo "- SHA256: ${sha256}" >> "$OUTPUT"
              echo >> "$OUTPUT"
            fi
          done < "$TMP_LIST"

          rm -f "$TMP_LIST"

      - name: Commit and push result
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$OUTPUT_FILE"

          if git diff --quiet -- "$OUTPUT"; then
            echo "No changes in $OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$OUTPUT"
          git commit -m "chore: update project snapshot markdown"
          git push