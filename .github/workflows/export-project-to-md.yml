name: Export Project To Markdown

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build single markdown file
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="project-files.md"

          {
            echo "# Project Files Snapshot"
            echo
            echo "Generated by GitHub Actions workflow: \\.github/workflows/export-project-to-md.yml"
            echo
          } > "$OUTPUT"

          while IFS= read -r -d '' file; do
            rel="${file#./}"

            echo "## \\`$rel\\`" >> "$OUTPUT"

            if grep -Iq . "$file"; then
              ext="${rel##*.}"
              if [[ "$rel" == "$ext" ]]; then
                ext="txt"
              fi

              echo "\\`\\`\\`$ext" >> "$OUTPUT"
              cat "$file" >> "$OUTPUT"
              echo >> "$OUTPUT"
              echo "\\`\\`\\`" >> "$OUTPUT"
              echo >> "$OUTPUT"
            else
              size_bytes="$(wc -c < "$file" | tr -d ' ')"
              sha256="$(sha256sum "$file" | awk '{print $1}')"

              echo "Binary file (content not embedded)." >> "$OUTPUT"
              echo >> "$OUTPUT"
              echo "- Size: ${size_bytes} bytes" >> "$OUTPUT"
              echo "- SHA256: ${sha256}" >> "$OUTPUT"
              echo >> "$OUTPUT"
            fi
          done < <(
            find . -type f \
              -not -path "./.git/*" \
              -not -path "./.github/workflows/*" \
              -not -name "$OUTPUT" \
              -print0 | sort -z
          )

      - name: Commit and push result
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="project-files.md"

          if git diff --quiet -- "$OUTPUT"; then
            echo "No changes in $OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$OUTPUT"
          git commit -m "chore: update project snapshot markdown"
          git push