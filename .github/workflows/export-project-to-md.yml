name: Export Project To Markdown And HTML

on:
  push:
    paths-ignore:
      - project-files.md
      - project-files.html
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    env:
      OUTPUT_MD: "project-files.md"
      OUTPUT_HTML: "project-files.html"
      # Space-separated folders to include. Leave empty to include the whole repo.
      INCLUDE_DIRS: ""
      # Space-separated folders to exclude from export.
      EXCLUDE_DIRS: ".git node_modules dist build .next .cache www/js/eruda"
      # Space-separated files to exclude from export.
      EXCLUDE_FILES: "artifact.tar www/styles.css www/js/debug-eruda-toggle.js www/js/eruda.js"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build markdown and html exports
        shell: bash
        run: |
          set -euo pipefail

          python3 << 'PY'
          import hashlib
          import html
          import os
          from fnmatch import fnmatch
          from pathlib import Path

          output_md = os.getenv("OUTPUT_MD", "project-files.md")
          output_html = os.getenv("OUTPUT_HTML", "project-files.html")

          def normalize_rel(value: str) -> str:
              value = value.strip().replace("\\", "/")
              parts = [p for p in value.split("/") if p and p != "."]
              return "/".join(parts)

          output_md_norm = normalize_rel(output_md)
          output_html_norm = normalize_rel(output_html)

          include_dirs = [normalize_rel(x) for x in os.getenv("INCLUDE_DIRS", "").split() if x.strip()]
          exclude_dirs = [normalize_rel(x) for x in os.getenv("EXCLUDE_DIRS", "").split() if x.strip()]
          exclude_file_patterns = [normalize_rel(x) for x in os.getenv("EXCLUDE_FILES", "").split() if x.strip()]

          root = Path(".").resolve()

          def should_skip(rel_path: str) -> bool:
              rel_path = normalize_rel(rel_path)
              if rel_path in {output_md_norm, output_html_norm}:
                  return True
              if rel_path.startswith(".git/"):
                  return True

              # Hard guard for paths that must never be exported.
              if rel_path in {
                  "www/styles.css",
                  "www/js/debug-eruda-toggle.js",
                  "www/js/eruda.js",
              }:
                  return True
              if rel_path.startswith("www/js/eruda/"):
                  return True

              for pattern in exclude_file_patterns:
                  # Supports exact paths and wildcard patterns like *.css.
                  if fnmatch(rel_path, pattern) or fnmatch(Path(rel_path).name, pattern):
                      return True
              for folder in exclude_dirs:
                  if rel_path == folder or rel_path.startswith(folder + "/"):
                      return True
              return False

          def candidate_files():
              found = []
              if include_dirs:
                  for folder in include_dirs:
                      p = Path(folder)
                      if p.is_dir():
                          found.extend(x for x in p.rglob("*") if x.is_file())
              else:
                  found.extend(x for x in Path(".").rglob("*") if x.is_file())

              unique = {}
              for f in found:
                  rel = f.resolve().relative_to(root).as_posix()
                  unique[rel] = f

              for rel in sorted(unique.keys()):
                  if not should_skip(rel):
                      yield unique[rel], rel

          def is_text_file(path: Path) -> bool:
              try:
                  chunk = path.read_bytes()[:8192]
              except OSError:
                  return False
              if b"\x00" in chunk:
                  return False
              try:
                  chunk.decode("utf-8")
                  return True
              except UnicodeDecodeError:
                  return False

          md_lines = [
              "# Project Files Snapshot",
              "",
              "Generated by GitHub Actions workflow: .github/workflows/export-project-to-md.yml",
              "",
          ]

          chunk_limit = 12000
          entries = []

          for file_path, rel in candidate_files():
              md_lines.append(f"## `{rel}`")

              if is_text_file(file_path):
                  ext = file_path.suffix.lstrip(".") or "txt"
                  text = file_path.read_text(encoding="utf-8", errors="replace")
                  md_lines.append(f"```{ext}")
                  md_lines.append(text)
                  md_lines.append("```")
                  md_lines.append("")

                  html_block = "\n".join([
                      "  <article class=\"file-block\">",
                      f"    <h3>Path: <code>{html.escape(rel)}</code></h3>",
                      f"    <p class=\"meta\">Type: text ({html.escape(ext)})</p>",
                      "    <pre><code>",
                      html.escape(text),
                      "    </code></pre>",
                      "  </article>",
                  ])

                  plain_block = "\n".join([
                      f"Path: {rel}",
                      f"Type: text ({ext})",
                      "",
                      text,
                  ])
              else:
                  file_bytes = file_path.read_bytes()
                  size = len(file_bytes)
                  sha256 = hashlib.sha256(file_bytes).hexdigest()

                  md_lines.append("Binary file (content not embedded).")
                  md_lines.append("")
                  md_lines.append(f"- Size: {size} bytes")
                  md_lines.append(f"- SHA256: {sha256}")
                  md_lines.append("")

                  html_block = "\n".join([
                      "  <article class=\"file-block\">",
                      f"    <h3>Path: <code>{html.escape(rel)}</code></h3>",
                      "    <p>Binary file (content not embedded).</p>",
                      "    <ul>",
                      f"      <li>Size: {size} bytes</li>",
                      f"      <li>SHA256: {sha256}</li>",
                      "    </ul>",
                      "  </article>",
                  ])

                  plain_block = "\n".join([
                      f"Path: {rel}",
                      "Binary file (content not embedded).",
                      f"Size: {size} bytes",
                      f"SHA256: {sha256}",
                  ])

              entries.append({
                  "path": rel,
                  "html": html_block,
                  "plain": plain_block,
                  "length": len(plain_block),
              })

          parts = []
          current_entries = []
          current_len = 0

          for entry in entries:
              e_len = entry["length"]
              if e_len > chunk_limit:
                  if current_entries:
                      parts.append({
                          "entries": current_entries,
                          "length": current_len,
                          "note": "",
                      })
                      current_entries = []
                      current_len = 0

                  parts.append({
                      "entries": [entry],
                      "length": e_len,
                      "note": f"Part is larger than {chunk_limit} characters because file '{entry['path']}' is larger and was not split.",
                  })
                  continue

              if current_entries and current_len + e_len > chunk_limit:
                  parts.append({
                      "entries": current_entries,
                      "length": current_len,
                      "note": "",
                  })
                  current_entries = []
                  current_len = 0

              current_entries.append(entry)
              current_len += e_len

          if current_entries:
              parts.append({
                  "entries": current_entries,
                  "length": current_len,
                  "note": "",
              })

          html_lines = [
              "<!DOCTYPE html>",
              "<html lang=\"en\">",
              "<head>",
              "  <meta charset=\"UTF-8\">",
              "  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">",
              "  <title>Project Files Snapshot</title>",
              "  <style>",
              "    body { font-family: Arial, sans-serif; margin: 24px; line-height: 1.5; }",
              "    h1 { margin-top: 0; }",
              "    h2 { margin: 0; font-size: 20px; }",
              "    h3 { margin-bottom: 8px; }",
              "    .parts-nav { position: sticky; top: 0; z-index: 10; background: #ffffff; border-bottom: 1px solid #d0d7de; padding: 10px 0; margin-bottom: 14px; }",
              "    .parts-nav a { margin-right: 12px; text-decoration: none; color: #0969da; font-size: 14px; }",
              "    .part { border-top: 2px solid #d0d7de; padding-top: 20px; margin-top: 24px; }",
              "    .part-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }",
              "    .copy-btn { border: 1px solid #1f2328; background: #1f2328; color: #fff; padding: 6px 12px; cursor: pointer; }",
              "    .meta { color: #57606a; }",
              "    .note { color: #9a6700; font-weight: 600; }",
              "    pre { background: #f6f8fa; padding: 12px; overflow-x: auto; border: 1px solid #d0d7de; }",
              "    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }",
              "    .copy-source { position: absolute; left: -9999px; top: 0; }",
              "  </style>",
              "  <script>",
              "    async function copyPart(id) {",
              "      const source = document.getElementById(id);",
              "      if (!source) return;",
              "      const text = source.value;",
              "      try {",
              "        await navigator.clipboard.writeText(text);",
              "      } catch (err) {",
              "        source.style.position = 'static';",
              "        source.select();",
              "        document.execCommand('copy');",
              "        source.style.position = 'absolute';",
              "        source.style.left = '-9999px';",
              "      }",
              "    }",
              "  </script>",
              "</head>",
              "<body>",
              "  <h1>Project Files Snapshot</h1>",
              "  <p>Generated by GitHub Actions workflow: <code>.github/workflows/export-project-to-md.yml</code></p>",
              f"  <p>HTML content is split into parts of about {chunk_limit} characters without splitting single files.</p>",
          ]

          html_lines.append("  <nav class=\"parts-nav\"><strong>Quick parts:</strong> ")
          for i in range(1, len(parts) + 1):
              html_lines.append(f"    <a href=\"#part-{i}\">Part {i}</a>")
          html_lines.append("  </nav>")

          for index, part in enumerate(parts, start=1):
              part_id = f"part-{index}"
              copy_id = f"copy-source-{index}"
              part_text = "\n\n".join(item["plain"] for item in part["entries"])
              html_lines.append(f"  <section id=\"{part_id}\" class=\"part\">")
              html_lines.append("    <div class=\"part-header\">")
              html_lines.append(f"      <h2>Part {index}</h2>")
              html_lines.append(f"      <button class=\"copy-btn\" onclick=\"copyPart('{copy_id}')\">Copy Part {index}</button>")
              html_lines.append("    </div>")
              html_lines.append(f"    <p class=\"meta\">Approx chars: {part['length']}</p>")
              if part["note"]:
                  html_lines.append(f"    <p class=\"note\">{html.escape(part['note'])}</p>")
              html_lines.append(f"    <textarea id=\"{copy_id}\" class=\"copy-source\">{html.escape(part_text)}</textarea>")

              for item in part["entries"]:
                  html_lines.append(item["html"])

              html_lines.append("  </section>")

          html_lines.extend(["</body>", "</html>"])

          Path(output_md).write_text("\n".join(md_lines) + "\n", encoding="utf-8")
          Path(output_html).write_text("\n".join(html_lines) + "\n", encoding="utf-8")
          PY

      - name: Validate export files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUTPUT_MD"
          test -f "$OUTPUT_HTML"
          # Ensure we do not create nested archives.
          test ! -f project-export.zip

      - name: Validate excluded paths are not in export
        shell: bash
        run: |
          set -euo pipefail
          blocked=(
            "www/styles.css"
            "www/js/debug-eruda-toggle.js"
            "www/js/eruda.js"
            "www/js/eruda/plugins.js"
            "www/js/eruda/vendor/eruda.min.js"
          )

          for path in "${blocked[@]}"; do
            # Match only exported file-entry markers, not incidental mentions
            # (for example inside workflow source code blocks).
            md_marker=$(printf '## `%s`' "$path")
            if grep -Fq "$md_marker" "$OUTPUT_MD" \
              || grep -Fq "Path: $path" "$OUTPUT_HTML" \
              || grep -Fq "Path: <code>$path</code>" "$OUTPUT_HTML"; then
              echo "Excluded path leaked into export: $path"
              exit 1
            fi
          done

      - name: Upload export artifact
        uses: actions/upload-artifact@v5
        with:
          name: project-files-md-html
          path: |
            ${{ env.OUTPUT_MD }}
            ${{ env.OUTPUT_HTML }}
          if-no-files-found: error
          retention-days: 14