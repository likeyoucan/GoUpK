name: Deploy to GitHub Pages

# Убираем несуществующий env, он не нужен
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "vite_1"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Скачивание кода
        uses: actions/checkout@v4

      - name: ⚙️ Настройка Node.js (Версия 22 — самая свежая)
        uses: actions/setup-node@v4 # Максимальная версия сейчас - v4
        with:
          node-version: "22"       # Стабильная текущая версия

      - name: 📦 Установка зависимостей
        run: npm install

      - name: 🎨 Сборка стилей Tailwind CSS v4
        run: npm run build:css

      - name: 🏷️ Обновление версии (Cache Busting)
        run: |
          find ./www -type f \( -name "*.html" -o -name "*.js" \) -exec sed -i "s/\?v=VERSION/?v=${{ github.run_id }}/g" {} +

      - name: ✅ Проверка на поломанный JS
        run: |
          if grep -R -nE "const [0-9]+ =" ./www/js; then
            echo "Cache-busting broke JS syntax"
            exit 1
          fi

      - name: 🌐 Настройка GitHub Pages
        uses: actions/configure-pages@v5 # Обновил до v5

      - name: 📤 Загрузка папки www
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./www"

      - name: 🚀 Публикация сайта
        id: deployment
        uses: actions/deploy-pages@v4